#==========================================================================
# Description: Compile the kernel with MT7663 patch
#==========================================================================

name: Compile the kernel

on:
  workflow_dispatch:
    inputs:
      kernel_version:
        description: "Select kernel version"
        required: false
        default: "6.6.y"
        type: choice
        options:
          - 6.6.y
          - 6.12.y
          - 6.18.y
      kernel_toolchain:
        description: "Select the compilation toolchain"
        required: false
        default: "gcc"
        type: choice
        options:
          - gcc
          - clang
      ccache_clear:
        description: "Set whether to clear the cache"
        required: false
        default: false
        type: boolean

env:
  TZ: Etc/UTC

jobs:
  build:
    runs-on: ubuntu-26.04-arm          # 关键：ARM64 运行器，避免 Docker 平台不匹配
    permissions:
      contents: write

    name: compile-kernel-${{ inputs.kernel_version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Initialize the build environment
        id: init
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get -y update
          sudo apt-get -y install $(curl -fsSL https://ophub.org/ubuntu2604-build-armbian-depends)
          sudo timedatectl set-timezone "${TZ:-Etc/UTC}"
          sudo ntpdate ntp.ubuntu.com 0.pool.ntp.org || true
          date -u
          echo "status=success" >> ${GITHUB_OUTPUT}

      - name: Create virtual disk for extended storage
        id: disk
        run: |
          root_avail=$(df --block-size=1G / | tail -1 | awk '{print $4}')
          root_size=$(( root_avail - 4 ))
          [[ "${root_size}" -gt 0 ]] || { echo "Insufficient space"; exit 1; }
          sudo truncate -s "${root_size}"G /root.img
          build_dev=$(sudo losetup --find --show /root.img)
          sudo mkfs.xfs -f -i sparse=0 -b size=4096 "${build_dev}"
          sudo mkdir -p /builder
          sudo mount "${build_dev}" /builder
          sudo chown -R runner:runner /builder
          df -Th
          echo "status=success" >> ${GITHUB_OUTPUT}

      - name: Cache ccache
        uses: actions/cache@v5
        with:
          path: /builder/ccache
          key: kernel-${{ inputs.kernel_toolchain }}-${{ inputs.kernel_version }}-${{ github.sha }}
          restore-keys: |
            kernel-${{ inputs.kernel_toolchain }}-${{ inputs.kernel_version }}-

      # ================== 终极地毯式暴力注入开始 ==================
      - name: Force inject MT7663 combination patch into framework
        run: |
          echo "Executing deep filesystem sweep to force patch replacement..."
          
          # 检查我们仓库自带的 patch 是否完好
          LOCAL_PATCH="compile-kernel/tools/patch/linux-${{ inputs.kernel_version }}/mt7663-semaphore-retry.patch"
          if [ ! -f "$LOCAL_PATCH" ]; then
              # 兼容没有 linux- 前缀的旧路径名
              LOCAL_PATCH="compile-kernel/tools/patch/${{ inputs.kernel_version }}/mt7663-semaphore-retry.patch"
          fi
          
          echo "Target local patch path verified: $LOCAL_PATCH"
          cat "$LOCAL_PATCH" | grep -E "timeout|msleep"
          
          # 地毯式搜寻当前运行器上所有名为 linux-6.6.y 或 包含 mt7663 补丁的框架内置目录
          # 不管它是被下载在 _actions 还是隐藏在编译器的 docker 主机目录中，全部重写覆盖！
          TARGET_DIRS=$(find /home/runner/work/ -type d -path "*/tools/patch/*" 2>/dev/null || true)
          
          for dir in $TARGET_DIRS; do
              if [[ "$dir" == *"${{ inputs.kernel_version }}"* ]]; then
                  echo "Found framework target patch directory: $dir"
                  cp -f "$LOCAL_PATCH" "$dir/mt7663-semaphore-retry.patch"
                  echo "Successfully forced overwritten: $dir/mt7663-semaphore-retry.patch"
              fi
          done
      # ================== 终极地毯式暴力注入结束 ==================

      - name: Compile the kernel [ ${{ inputs.kernel_version }} ]
        uses: trancedj20240410/amlogic-s9xxx-armbian@main
        if: ${{ steps.disk.outputs.status == 'success' && !cancelled() }}
        with:
          build_target: kernel
          kernel_source: unifreq
          kernel_version: ${{ inputs.kernel_version }}
          kernel_auto: true
          delete_source: true
          kernel_package: all
          kernel_sign: -ophub
          kernel_toolchain: ${{ inputs.kernel_toolchain }}
          ccache_clear: ${{ inputs.ccache_clear }}
          docker_hostpath: /builder
          docker_image: ophub/armbian-resolute:arm64
          auto_patch: true

      - name: Upload Kernel to Release
        uses: ophub/upload-to-releases@main
        if: ${{ env.PACKAGED_STATUS == 'success' && !cancelled() }}
        with:
          tag: kernel_stable
          artifacts: ${{ env.PACKAGED_OUTPUTPATH }}/*
          allow_updates: true
          remove_artifacts: false
          replaces_artifacts: true
          make_latest: false
          gh_token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            - Custom kernel with MT7663 patch semaphore retry
            - 包含 MT7663 信号量重试补丁的自编译内核
